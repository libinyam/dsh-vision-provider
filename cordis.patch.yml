# Registers one selectable composite model. The OpenAI-compatible vision model
# is an internal sidecar and is never registered as a standalone chat route.
#
# Existing v0.1.0 users may still have a user-owned `vision-openai` provider in
# Settings > Models. It can be deleted after upgrading; this bundle no longer
# creates or uses that provider route.

- insert:
    - id: dsh-vision-provider
      name: dsh-vision-provider
      config:
        provider: deepseek-vision
        displayName: !!js process.env.DSH_VISION_DISPLAY_NAME ?? 'DeepSeek + Vision'
        model: !!js process.env.DSH_VISION_COMPOSITE_MODEL ?? 'deepseek-v4-flash'
        modelName: !!js process.env.DSH_VISION_COMPOSITE_NAME ?? 'DeepSeek V4 Flash + Vision'
        mainProvider: !!js process.env.DSH_VISION_MAIN_PROVIDER ?? 'deepseek-official'
        mainModel: !!js process.env.DSH_VISION_MAIN_MODEL ?? 'deepseek-v4-flash'
        visionBaseURL: !!js process.env.DSH_VISION_BASE_URL ?? 'https://api.openai.com/v1'
        visionModel: !!js process.env.DSH_VISION_MODEL ?? 'gpt-4.1-mini'
        visionApiKeyEnv: !!js process.env.DSH_VISION_API_KEY_ENV ?? 'VISION_OPENAI_API_KEY'
        visionNoAuth: !!js process.env.DSH_VISION_NO_AUTH === '1'
        visionMaxTokens: !!js Number(process.env.DSH_VISION_MAX_TOKENS ?? 1024)
        visionTimeoutMs: !!js Number(process.env.DSH_VISION_TIMEOUT_MS ?? 120000)
        visionDetail: !!js process.env.DSH_VISION_DETAIL ?? 'auto'
        preferLegacyProvider: !!js process.env.DSH_VISION_USE_LEGACY !== '0'
        legacyProvider: !!js process.env.DSH_VISION_LEGACY_PROVIDER ?? 'vision-openai'
        legacyModel: !!js process.env.DSH_VISION_LEGACY_MODEL
